<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Giriş</title><style>body{font-family:'Segoe UI';background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px} .container{background:white;padding:40px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-width:400px;width:100%;text-align:center} h1{color:#667eea;margin-bottom:10px} .form-group{margin-bottom:20px;text-align:left} label{display:block;margin-bottom:8px;color:#555;font-weight:600} select,input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;box-sizing:border-box} select:focus,input:focus{outline:none;border-color:#667eea} button{width:100%;padding:14px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer} button:hover{transform:translateY(-2px)}</style></head><body><div class="container"><h1>🏫 Okul Sistemi</h1><p>Hoş Geldiniz</p><div class="form-group"><label>Kullanıcı Türü Seçin</label><select id="userType" onchange="showForm()"><option value="">-- Seçiniz --</option><option value="admin">Admin Giriş</option><option value="veli">Veli Giriş</option></select></div><div id="adminForm" style="display:none"><div class="form-group"><label>Şifre</label><input type="password" id="adminPass" placeholder="Şifrenizi girin"></div><button onclick="adminLogin()">🔐 Giriş Yap</button></div><div id="veliForm" style="display:none"><div class="form-group"><label>Ad Soyad</label><input type="text" id="veliAd" placeholder="Ad Soyad"></div><div class="form-group"><label>Öğrenci No</label><input type="text" id="veliNo" placeholder="Öğrenci No"></div><button onclick="veliLogin()">👨‍👩‍👦 Giriş Yap</button></div></div><script>function showForm(){const t=document.getElementById('userType').value;document.getElementById('adminForm').style.display=t==='admin'?'block':'none';document.getElementById('veliForm').style.display=t==='veli'?'block':'none'}function adminLogin(){const p=document.getElementById('adminPass').value;if(p==='1234'){localStorage.setItem('userType','admin');window.location.href='admin.html'}else{alert('Şifre yanlış!')}}function veliLogin(){const a=document.getElementById('veliAd').value,n=document.getElementById('veliNo').value;if(a&&n){localStorage.setItem('userType','veli');localStorage.setItem('veliAd',a);localStorage.setItem('veliNo',n);window.location.href='veli.html'}else{alert('Bilgileri doldurun!')}}</script></body></html>
