<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel v26</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:20px;min-height:100vh}
.kutu{background:white;padding:30px;border-radius:15px;max-width:950px;margin:auto;box-shadow:0 10px 40px rgba(0,0,0,0.3)}
h2{color:#667eea;margin-top:0;text-align:center}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:20px;border-bottom:2px solid #eee;padding-bottom:10px}
.tab-btn{flex:1;min-width:150px;padding:12px;background:#ddd;border:none;border-radius:8px;cursor:pointer;font-weight:bold;transition:0.3s}
.tab-btn.aktif{background:#4caf50;color:white}
.tab-content{display:none}
.tab-content.aktif{display:block;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:2px solid #ddd;border-radius:8px;font-size:15px}
button.ekle{background:#4caf50;color:white;border:none;padding:12px 25px;border-radius:8px;cursor:pointer;font-weight:bold;margin-top:10px}
button.ekle:hover{background:#45a049}
.ogr-kart{background:#f5f5f5;padding:12px;margin:8px 0;border-radius:8px;border-left:4px solid #667eea}
.basari{color:green;background:#e8f5e9;padding:10px;border-radius:8px;margin-top:10px}
.hata{color:red;background:#ffe6e6;padding:10px;border-radius:8px;margin-top:10px}
</style>
</head>
<body>
<div class="kutu">
<h2>👨‍🏫 Admin Panel v26</h2>

<div class="tabs">
<button class="tab-btn aktif" onclick="sekmeDegistir('ekle',this)">➕ Öğrenci Ekle</button>
<button class="tab-btn" onclick="sekmeDegistir('ders',this)">📚 Ders Ekle</button>
<button class="tab-btn" onclick="sekmeDegistir('liste',this)">👥 Öğrenci Listesi</button>
<button class="tab-btn" onclick="sekmeDegistir('not',this)">📝 Toplu Not Girişi</button>
<button class="tab-btn" onclick="sekmeDegistir('duyuru',this)">📢 Duyuru</button>
</div>

<!-- 1. ÖĞRENCİ EKLE -->
<div id="ekle" class="tab-content aktif">
<h3>Öğrenci Ekle</h3>
<select id="sinif">
<option>4. Sınıf</option><option>5. Sınıf</option><option>6. Sınıf</option><option>7. Sınıf</option>
<option>8. Sınıf</option><option>9. Sınıf</option><option>10. Sınıf</option>
<option>11. Sınıf</option><option>12. Sınıf</option>
</select>
<input type="text" id="ad" placeholder="Ad Soyad">
<input type="password" id="sifre" placeholder="Şifre">
<button class="ekle" onclick="ogrenciEkle()">Ekle</button>
<div id="ekleMesaj"></div>
</div>

<!-- 2. DERS EKLE -->
<div id="ders" class="tab-content">
<h3>Sınıfa Ders Ekle</h3>
<select id="dersSinif">
<option>4. Sınıf</option><option>5. Sınıf</option><option>6. Sınıf</option><option>7. Sınıf</option>
<option>8. Sınıf</option><option>9. Sınıf</option><option>10. Sınıf</option>
<option>11. Sınıf</option><option>12. Sınıf</option>
</select>
<input type="text" id="dersAdi" placeholder="Ders Adı: Matematik">
<button class="ekle" onclick="dersEkle()">Ders Ekle</button>
<div id="dersListesi" style="margin-top:15px"></div>
</div>

<!-- 3. LİSTE -->
<div id="liste" class="tab-content">
<h3>Öğrenci Listesi</h3>
<button class="ekle" onclick="listeleOgrenciler()">Listeyi Yenile</button>
<div id="ogrListesi" style="margin-top:15px"></div>
</div>

<!-- 4. TOPLU NOT -->
<div id="not" class="tab-content">
<h3>📝 Toplu Not Girişi</h3>
<select id="notSinif" onchange="sinifOgrencileriYukle()">
<option>Sınıf seç...</option>
<option>4. Sınıf</option><option>5. Sınıf</option><option>6. Sınıf</option><option>7. Sınıf</option>
<option>8. Sınıf</option><option>9. Sınıf</option><option>10. Sınıf</option>
<option>11. Sınıf</option><option>12. Sınıf</option>
</select>
<select id="notOgrenci" disabled>
<option>Önce sınıf seç...</option>
</select>
<div id="notGirisAlani" style="display:none;margin-top:15px">
<select id="notDers"><option>Ders seç...</option></select>
<div style="display:flex;gap:5px;flex-wrap:wrap">
<input type="number" id="not1" placeholder="1.Yazılı" min="0" max="100" style="flex:1">
<input type="number" id="not2" placeholder="2.Yazılı" min="0" max="100" style="flex:1">
<input type="number" id="not3" placeholder="3.Yazılı" min="0" max="100" style="flex:1">
<input type="number" id="not4" placeholder="4.Yazılı" min="0" max="100" style="flex:1">
</div>
<button class="ekle" onclick="notKaydetAdmin()" style="background:#2196F3">Kaydet</button>
</div>
<div id="mevcutNotlar" style="margin-top:15px"></div>
</div>

<!-- 5. DUYURU -->
<div id="duyuru" class="tab-content">
<h3>📢 Sınıf Duyurusu</h3>
<select id="duyuruSinif">
<option>4. Sınıf</option><option>5. Sınıf</option><option>6. Sınıf</option><option>7. Sınıf</option>
<option>8. Sınıf</option><option>9. Sınıf</option><option>10. Sınıf</option>
<option>11. Sınıf</option><option>12. Sınıf</option>
</select>
<input type="text" id="duyuruBaslik" placeholder="Başlık: Yazılı Tarihleri">
<textarea id="duyuruMetin" placeholder="Duyuru metnini yazın..." rows="4"></textarea>
<button class="ekle" onclick="duyuruGonder()" style="background:#ff9800">Yayınla</button>
</div>

</div>

<script>
const STORAGE='ogrenciler_v6';
const DERS_KEY='sinif_dersleri_v2';

function sekmeDegistir(id,btn){
document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('aktif'));
document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('aktif'));
document.getElementById(id).classList.add('aktif');
btn.classList.add('aktif');
if(id==='liste')listeleOgrenciler();
if(id==='ders')dersListele();
}

function ogrencileriGetir(){
return JSON.parse(localStorage.getItem(STORAGE)||'[]');
}
function ogrencileriKaydet(l){
localStorage.setItem(STORAGE,JSON.stringify(l));
}

function ogrenciEkle(){
let sinif=document.getElementById('sinif').value;
let ad=document.getElementById('ad').value.trim();
let sifre=document.getElementById('sifre').value;
let msg=document.getElementById('ekleMesaj');
msg.innerHTML='';

if(!ad||!sifre){
msg.innerHTML='<div class="hata">Ad ve şifre boş olamaz!</div>';
return;
}
let ogrenciler=ogrencileriGetir();
if(ogrenciler.find(o=>o.ad===ad)){
msg.innerHTML='<div class="hata">Bu öğrenci zaten kayıtlı!</div>';
return;
}
ogrenciler.push({ad:ad,sinif:sinif,sifre:sifre,notlar:{}});
ogrencileriKaydet(ogrenciler);
msg.innerHTML='<div class="basari">✓ Öğrenci eklendi</div>';
document.getElementById('ad').value='';
document.getElementById('sifre').value='';
}

function dersEkle(){
let sinif=document.getElementById('dersSinif').value;
let ders=document.getElementById('dersAdi').value.trim();
if(!ders){alert('Ders adı yazın');return;}
let dersler=JSON.parse(localStorage.getItem(DERS_KEY)||'{}');
if(!dersler[sinif])dersler[sinif]=[];
if(dersler[sinif].includes(ders)){alert('Bu ders zaten var');return;}
dersler[sinif].push(ders);
localStorage.setItem(DERS_KEY,JSON.stringify(dersler));
alert('Ders eklendi');
document.getElementById('dersAdi').value='';
dersListele();
}

function dersListele(){
let dersler=JSON.parse(localStorage.getItem(DERS_KEY)||'{}');
let html='';
if(Object.keys(dersler).length===0){
html='Henüz ders eklenmemiş';
}else{
Object.keys(dersler).forEach(s=>{
html+=`<div class="ogr-kart"><b>${s}</b>: ${dersler[s].join(', ')}</div>`;
});
}
document.getElementById('dersListesi').innerHTML=html;
}

function listeleOgrenciler(){
let ogrenciler=ogrencileriGetir();
ogrenciler.sort((a,b)=>a.sinif.localeCompare(b.sinif,'tr'));
let html='';
if(ogrenciler.length===0){
html='Kayıtlı öğrenci yok';
}else{
ogrenciler.forEach(o=>{
html+=`<div class="ogr-kart"><b>${o.ad}</b> - ${o.sinif} | Şifre: ${o.sifre}</div>`;
});
}
document.getElementById('ogrListesi').innerHTML=html;
}

function sinifOgrencileriYukle(){
let sinif=document.getElementById('notSinif').value;
let ogrenciler=ogrencileriGetir().filter(o=>o.sinif===sinif);
let sel=document.getElementById('notOgrenci');
sel.innerHTML='<option>Öğrenci seç...</option>';
sel.disabled=false;
ogrenciler.forEach(o=>sel.innerHTML+=`<option>${o.ad}</option>`);
sel.onchange=ogrenciSec;
}

function ogrenciSec(){
let ad=document.getElementById('notOgrenci').value;
let ogr=ogrencileriGetir().find(o=>o.ad===ad);
if(!ogr)return;
document.getElementById('notGirisAlani').style.display='block';
let dersSel=document.getElementById('notDers');
dersSel.innerHTML='<option>Ders seç...</option>';
Object.keys(ogr.notlar||{}).forEach(d=>dersSel.innerHTML+=`<option>${d}</option>`);
let html='<b>Mevcut Notlar:</b><br>';
Object.keys(ogr.notlar||{}).forEach(d=>{
let n=ogr.notlar;
html+=`<div class="ogr-kart">${d}: ${n.y1||'-'} | ${n.y2||'-'} | ${n.y3||'-'} | ${n.y4||'-'}</div>`;
});
document.getElementById('mevcutNotlar').innerHTML=html||'Not yok';
dersSel.onchange=dersSec;
}

function dersSec(){
let ad=document.getElementById('notOgrenci').value;
let ders=document.getElementById('notDers').value;
let ogr=ogrencileriGetir().find(o=>o.ad===ad);
let n=ogr.notlar||{y1:'',y2:'',y3:'',y4:''};
document.getElementById('not1').value=n.y1||'';
document.getElementById('not2').value=n.y2||'';
document.getElementById('not3').value=n.y3||'';
document.getElementById('not4').value=n.y4||'';
}

function notKaydetAdmin(){
let ad=document.getElementById('notOgrenci').value;
let ders=document.getElementById('notDers').value;
if(ders==='Ders seç...'){alert('Ders seçin');return;}
let ogrenciler=ogrencileriGetir();
let idx=ogrenciler.findIndex(o=>o.ad===ad);
if(!ogrenciler[idx].notlar)ogrenciler[idx].notlar={};
ogrenciler[idx].notlar[y1]=document.getElementById('not1').value;
ogrenciler[idx].notlar[y2]=document.getElementById('not2').value;
ogrenciler[idx].notlar[y3]=document.getElementById('not3').value;
ogrenciler[idx].notlar[y4]=document.getElementById('not4').value;
ogrencileriKaydet(ogrenciler);
alert(ad+' - '+ders+' notları kaydedildi!');
ogrenciSec();
}

function duyuruGonder(){
let sinif=document.getElementById('duyuruSinif').value;
let baslik=document.getElementById('duyuruBaslik').value;
let metin=document.getElementById('duyuruMetin').value;
if(!baslik||!metin){alert('Başlık ve metin doldurun');return;}
let duyurular=JSON.parse(localStorage.getItem('duyurular')||'[]');
duyurular.push({sinif,baslik,metin,tarih:new Date().toLocaleDateString('tr-TR')});
localStorage.setItem('duyurular',JSON.stringify(duyurular));
alert('Duyuru yayınlandı!');
document.getElementById('duyuruBaslik').value='';
document.getElementById('duyuruMetin').value='';
}
</script>
</body>
</html>
