<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Not Sistemi - Admin</title>
<style>
body{font-family:'Segoe UI',Arial;background:#f5f7fa;margin:0;padding:20px}
.container{max-width:700px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,0.08)}
h2{color:#2c3e50;margin-top:0;border-bottom:2px solid #007bff;padding-bottom:8px}
input,select{width:100%;padding:11px;margin:8px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;font-size:15px}
button.ekle{background:#28a745;color:white;border:none;padding:12px 20px;border-radius:6px;cursor:pointer;font-size:16px;width:100%;margin-top:12px;font-weight:bold}
button.ekle:hover{background:#218838}
.ogrenci-kutu{background:#f8f9fa;border-left:4px solid #007bff;padding:14px;margin:10px 0;border-radius:6px;display:flex;justify-content:space-between;align-items:center}
.ogrenci-bilgi{flex:1}
.sil-btn{background:#dc3545;padding:8px 14px;font-size:13px;border:none;border-radius:5px;color:white;cursor:pointer;font-weight:bold;margin-left:10px}
.sil-btn:hover{background:#c82333}
#liste{margin-top:20px;min-height:50px}
</style>
</head>
<body>
<div class="container">
<h2>1. Öğrenci Ekle</h2>
<input type="text" id="adInput" placeholder="Öğrenci Ad Soyad">
<select id="sinifInput">
<option>5. Sınıf</option>
<option>6. Sınıf</option>
<option>7. Sınıf</option>
<option>8. Sınıf</option>
</select>
<button class="ekle" onclick="ogrenciEkle()">Öğrenci Kaydet</button>

<h2 style="margin-top:35px">2. Kayıtlı Öğrenciler</h2>
<div id="liste">Henüz öğrenci yok</div>
</div>

<script>
let ogrenciler = JSON.parse(localStorage.getItem('ogrenciler_v2')) || [];

function ogrenciEkle(){
let ad = document.getElementById('adInput').value.trim();
let sinif = document.getElementById('sinifInput').value;

if(!ad){ 
alert('Ad Soyad girin!'); 
return; 
}

// Aynı isim+sınıf kontrolü
if(ogrenciler.find(o => o.ad.toLowerCase() === ad.toLowerCase() && o.sinif === sinif)){
alert('Bu öğrenci zaten kayıtlı!');
return;
}

ogrenciler.push({ad:ad, sinif:sinif, id:Date.now()});
localStorage.setItem('ogrenciler_v2', JSON.stringify(ogrenciler));

document.getElementById('adInput').value = '';
listele();
alert(ad + ' eklendi ✓');
}

function ogrenciSil(id){
if(confirm('Bu öğrenciyi silmek istediğinize emin misiniz?')){
ogrenciler = ogrenciler.filter(o => o.id !== id);
localStorage.setItem('ogrenciler_v2', JSON.stringify(ogrenciler));
listele();
}
}

function listele(){
let div = document.getElementById('liste');
if(ogrenciler.length === 0){
div.innerHTML = 'Henüz öğrenci yok';
return;
}

div.innerHTML = '';
ogrenciler.forEach(o => {
div.innerHTML += `
<div class="ogrenci-kutu">
<div class="ogrenci-bilgi"><b>${o.ad}</b> - ${o.sinif}</div>
<button class="sil-btn" onclick="ogrenciSil(${o.id})">Sil</button>
</div>
`;
});
}

// Sayfa açılınca listeyi göster
listele();
</script>
</body>
</html>
