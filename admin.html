
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
body{font-family:Arial;padding:20px;background:#f5f5f5}
.container{max-width:800px;margin:auto;background:white;padding:20px;border-radius:8px}
button{padding:10px 20px;margin:5px;cursor:pointer}
input{padding:8px;margin:5px}
.tab{display:none}
.tab.active{display:block}
</style>
</head>
<body>
<div class="container">
<h2>Admin Panel</h2>
<button onclick="sekme('ogrenci')">Öğrenci Ekle</button>
<button onclick="sekme('not')">Not Gir</button>

<div id="ogrenci" class="tab active">
<h3>Öğrenci Ekle</h3>
<input id="tc" placeholder="TC Kimlik">
<input id="ad" placeholder="Ad Soyad">
<button onclick="ekle()">Ekle</button>
</div>

<div id="not" class="tab">
<h3>Not Gir</h3>
<button onclick="listele()">Listele</button>
<div id="liste"></div>
</div>
</div>

<script>
function sekme(id){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById(id).classList.add('active');
}
function ekle(){
let tc=document.getElementById('tc').value;
let ad=document.getElementById('ad').value;
alert(tc+' - '+ad+' eklendi');
}
function listele(){
document.getElementById('liste').innerHTML='Öğrenci listesi buraya gelecek';
}
</script>
</body>
</html>
