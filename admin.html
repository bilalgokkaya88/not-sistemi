<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial; padding:20px; background:#f5f5f5}
   .kutu{background:white; padding:20px; border-radius:10px; max-width:500px; margin:auto}
    textarea{width:100%; padding:12px; height:120px; border:1px solid #ddd; border-radius:5px; font-size:16px}
    button{background:#25D366; color:white; border:none; padding:12px 30px; border-radius:5px; font-weight:bold; cursor:pointer}
   .not{color:#666; font-size:13px; margin-top:10px}
  </style>
</head>
<body>
  <div class="kutu">
    <h2>📢 Admin Paneli</h2>
    <h3>Duyuru Gönder</h3>
    <textarea id="mesaj" placeholder="Duyuru mesajını yaz..."></textarea>
    <button onclick="gonder()">Gönder</button>
    <p id="sonuc"></p>
    <p class="not">Not: Dini ders notlarını Google Sheet → Dini Ders sekmesinden yaz. Buradan işin yok.</p>
  </div>

<script>
function gonder(){
  var msg = document.getElementById('mesaj').value;
  if(!msg.trim()){alert('Mesaj boş olamaz'); return;}
  google.script.run.withSuccessHandler(s => {
    document.getElementById('sonuc').innerText = s;
    document.getElementById('mesaj').value = '';
  }).duyuruGonder(msg);
}
</script>
</body>
</html>
