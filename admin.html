<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
   .kutu { background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin-top: 5px; }
    button { background: #28a745; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; margin-top: 10px; font-size: 16px; }
    button:hover { background: #218838; }
    h3 { color: #333; margin-top: 0; }
   .not { font-size: 12px; color: #666; margin-top: 5px; }
  </style>
</head>
<body>
  <h2>📢 Admin Paneli</h2>

  <div class="kutu">
    <h3>Duyuru Gönder</h3>
    <textarea id="mesaj" placeholder="Duyuru mesajını yaz..."></textarea>
    <input id="resim" type="text" placeholder="Resim linki - Drive linki yapıştır">
    <div class="not">Resim için: Drive'a yükle → Paylaş → Link al</div>
    <select id="hedef" style="width:100%; padding:10px; margin-top:10px;">
      <option value="Tüm Veliler">Tüm Veliler</option>
      <option value="5. Sınıflar">5. Sınıflar</option>
      <option value="6. Sınıflar">6. Sınıflar</option>
      <option value="7. Sınıflar">7. Sınıflar</option>
      <option value="8. Sınıflar">8. Sınıflar</option>
    </select>
    <button onclick="gonder()">Gönder</button>
    <div id="sonuc" class="not"></div>
  </div>

  <div class="kutu">
    <h3>📖 Dini Ders Notu</h3>
    <p>Dini dersi <b>Google Sheet → Dini Ders sekmesinden</b> düzenliyorsun.</p>
    <p>Sen yazıp kaydet, veli otomatik görür. Buradan işin yok.</p>
  </div>

<script>
function gonder() {
  var mesaj = document.getElementById('mesaj').value;
  var resim = document.getElementById('resim').value;
  var hedef = document.getElementById('hedef').value;

  if (!mesaj.trim()) {
    alert('Mesaj boş olamaz');
    return;
  }

  document.getElementById('sonuc').innerHTML = 'Gönderiliyor...';

  google.script.run.withSuccessHandler(function(r){
    document.getElementById('sonuc').innerHTML = '✅ ' + r;
    document.getElementById('mesaj').value = '';
    document.getElementById('resim').value = '';
  }).duyuruGonder(mesaj, resim, hedef);
}
</script>
</body>
</html>
