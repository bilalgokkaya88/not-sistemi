<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
body{font-family:Arial;padding:20px;background:#f5f5f5}
.tab{display:flex;gap:10px;margin-bottom:20px}
.tab button{padding:10px 20px;border:none;background:#ddd;cursor:pointer;border-radius:5px}
.tab button.active{background:#4CAF50;color:white}
.tab-content{display:none}
.tab-content.active{display:block}
table{width:100%;border-collapse:collapse;background:white}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
th{background:#4CAF50;color:white}
td[contenteditable="true"]{background:#fff3cd;outline:2px solid #ffc107}
.btn-sil{background:#f44336;color:white;border:none;padding:5px 10px;cursor:pointer;border-radius:3px}
.alert{padding:10px;margin:10px 0;border-radius:5px;display:none}
.alert.success{background:#d4edda;color:#155724}
</style>
</head>
<body>
<h2>Öğrenci Yönetim Paneli</h2>

<div class="tab">
  <button class="active" onclick="showTab('liste')">2. Öğrenci Listesi</button>
</div>

<div id="liste" class="tab-content active">
  <div id="alert" class="alert success">Kaydedildi!</div>
  <table id="ogrenciTablo">
    <thead>
      <tr>
        <th>No</th>
        <th>Ad Soyad</th>
        <th>Sınıf</th>
        <th>Şifre</th>
        <th>İşlem</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
let ogrenciler = [];

async function yukle(){
  const res = await fetch('ogrenciler.json?v=' + Date.now());
  ogrenciler = await res.json();
  tabloyuCiz();
}

function tabloyuCiz(){
  const tbody = document.querySelector('#ogrenciTablo tbody');
  tbody.innerHTML = '';
  ogrenciler.forEach(o => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${o.no}</td>
      <td contenteditable="false" data-no="${o.no}" data-alan="ad">${o.ad}</td>
      <td contenteditable="false" data-no="${o.no}" data-alan="sinif">${o.sinif}</td>
      <td contenteditable="false" data-no="${o.no}" data-alan="sifre">${o.sifre}</td>
      <td><button class="btn-sil" onclick="sil(${o.no})">Sil</button></td>
    `;
    tbody.appendChild(tr);
  });

  // Çift tıkla düzenleme
  tbody.querySelectorAll('td[contenteditable]').forEach(td => {
    td.addEventListener('dblclick', () => {
      td.contentEditable = true;
      td.focus();
    });

    td.addEventListener('keydown', async (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        td.contentEditable = false;
        await kaydet(td.dataset.no, td.dataset.alan, td.innerText.trim());
      }
      if(e.key === 'Escape'){
        td.contentEditable = false;
        yukle(); // eski haline dön
      }
    });

    td.addEventListener('blur', () => {
      td.contentEditable = false;
    });
  });
}

async function kaydet(no, alan, deger){
  await fetch('/api/ogrenci-guncelle', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({no: parseInt(no), alan: alan, deger: deger})
  });
  alertGoster('Kaydedildi!');
  yukle();
}

async function sil(no){
  if(!confirm('Silinsin mi?')) return;
  await fetch('/api/ogrenci-sil', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({no: parseInt(no)})
  });
  alertGoster('Silindi!');
  yukle();
}

function alertGoster(mesaj){
  const alert = document.getElementById('alert');
  alert.innerText = mesaj;
  alert.style.display = 'block';
  setTimeout(() => alert.style.display = 'none', 2000);
}

function showTab(id){
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

yukle();
</script>
</body>
</html>
