<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel v38</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#667eea;padding:15px;margin:0}
.kutu{background:white;padding:20px;border-radius:12px;max-width:900px;margin:auto}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:20px}
.tab-btn{flex:1;min-width:110px;padding:12px;background:#ddd;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:14px}
.tab-btn.aktif{background:#4caf50;color:white}
.tab{display:none}.tab.aktif{display:block}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:2px solid #ddd;border-radius:6px;font-size:16px;box-sizing:border-box}
button{padding:12px 20px;background:#4caf50;color:white;border:none;border-radius:6px;cursor:pointer;margin:5px 0;font-size:16px}
button.kirmizi{background:#f44336}
.mesaj{margin-top:10px;padding:10px;border-radius:6px;text-align:center;font-weight:bold}
.basari{background:#d4edda;color:#155724}
.hata{background:#f8d7da;color:#721c24}
.ogr-kart{background:#f5f5f5;padding:10px;margin:5px 0;border-radius:6px;position:relative}
</style>
</head>
<body>
<div class="kutu">
<h2>👨‍🏫 Admin Panel v38</h2>

<div class="tabs">
<button class="tab-btn aktif" onclick="sekme('ekle',this)">➕ Öğrenci</button>
<button class="tab-btn" onclick="sekme('ders',this)">📚 Ders</button>
<button class="tab-btn" onclick="sekme('liste',this)">👥 Liste</button>
<button class="tab-btn" onclick="sekme('not',this)">📝 Not</button>
<button class="tab-btn" onclick="sekme('duyuru',this)">📢 Duyuru</button>
<button class="tab-btn" onclick="sekme('yedek',this)">💾 Yedek</button>
</div>

<div id="ekle" class="tab aktif">
<h3>Öğrenci Ekle - Telefon boşluksuz</h3>
<select id="sinif"><option>5. Sınıf</option><option>6. Sınıf</option><option>7. Sınıf</option><option>8. Sınıf</option></select>
<input id="ad" placeholder="Öğrenci Ad Soyad">
<input id="tel" type="tel" placeholder="Veli Telefon 05510447940" inputmode="numeric">
<input id="sifre" type="password" placeholder="Şifre">
<button onclick="ekle()">Kaydet</button>
<div id="m1" class="mesaj"></div>
</div>

<div id="ders" class="tab">
<h3>Ders Ekle</h3>
<select id="dsinif"><option>5. Sınıf</option><option>6. Sınıf</option><option>7. Sınıf</option><option>8. Sınıf</option></select>
<input id="dersad" placeholder="Ders Adı">
<button onclick="dersEkle()">Ekle</button>
<div id="dersliste" style="margin-top:15px"></div>
</div>

<div id="liste" class="tab">
<h3>Öğrenci Listesi - Sil butonu var</h3>
<button onclick="listele()">Yenile</button>
<div id="list" style="margin-top:15px"></div>
</div>

<div id="not" class="tab">
<h3>Not Girişi</h3>
<select id="nsinif" onchange="ogrYukle()"><option>Sınıf seç</option><option>5. Sınıf</option><option>6. Sınıf</option><option>7. Sınıf</option><option>8. Sınıf</option></select>
<select id="nogr"><option>Önce sınıf seç</option></select>
<select id="nders"><option>Ders seç</option></select>
<input id="n1" type="number" placeholder="1.Yazılı">
<input id="n2" type="number" placeholder="2.Yazılı">
<input id="n3" type="number" placeholder="3.Yazılı">
<input id="n4" type="number" placeholder="4.Yazılı">
<button onclick="notKaydet()">Kaydet</button>
<div id="mnot" class="mesaj"></div>
</div>

<div id="duyuru" class="tab">
<h3>Duyuru Yayınla</h3>
<select id="dusinif"><option>5. Sınıf</option><option>6. Sınıf</option><option>7. Sınıf</option><option>8. Sınıf</option></select>
<input id="dbaslik" placeholder="Başlık">
<textarea id="dmetin" rows="3" placeholder="Duyuru metni"></textarea>
<button onclick="duyGonder()">Yayınla</button>
<div id="m5" class="mesaj"></div>
</div>

<div id="yedek" class="tab">
<h3>💾 GitHub Yedek</h3>
<p>Öğrenci sil/ekle yaptıktan sonra mutlaka indirip GitHub'a yükle!</p>
<button onclick="indir()">ogrenciler.json İndir</button>
<button onclick="indirDers()">dersler.json İndir</button>
<button onclick="indirDuyuru()">duyurular.json İndir</button>
</div>

</div>

<script>
let ogrenciler = [];
let dersler = {};
let duyurular = [];

// Sayfa açılınca JSON'dan yükle
async function veriYukle(){
  try{
    let r = await fetch('ogrenciler.json?v='+Date.now());
    if(r.ok) ogrenciler = await r.json();
    else ogrenciler = JSON.parse(localStorage.getItem('ogr') || '[]');
  }catch(e){
    ogrenciler = JSON.parse(localStorage.getItem('ogr') || '[]');
  }

  try{
    let r2 = await fetch('dersler.json?v='+Date.now());
    if(r2.ok) dersler = await r2.json();
    else dersler = JSON.parse(localStorage.getItem('ders') || '{}');
  }catch(e){
    dersler = JSON.parse(localStorage.getItem('ders') || '{}');
  }

  try{
    let r3 = await fetch('duyurular.json?v='+Date.now());
    if(r3.ok) duyurular = await r3.json();
    else duyurular = JSON.parse(localStorage.getItem('duy') || '[]');
  }catch(e){
    duyurular = JSON.parse(localStorage.getItem('duy') || '[]');
  }
}
veriYukle();

function sekme(id,btn){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('aktif'));
document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('aktif'));
document.getElementById(id).classList.add('aktif');
btn.classList.add('aktif');
if(id==='liste')setTimeout(listele,200);
if(id==='ders')setTimeout(dersListe,200);
}

function ekle(){
let s=document.getElementById('sinif').value;
let a=document.getElementById('ad').value.trim();
let t=document.getElementById('tel').value.replace(/\s/g,'');
let p=document.getElementById('sifre').value.trim();
let m=document.getElementById('m1');
m.className='mesaj';

if(!a||!t||!p){m.className='mesaj hata';m.innerText='Tüm alanları doldur!';return;}
if(ogrenciler.find(x=>x.tel==t)){m.className='mesaj hata';m.innerText='Bu telefon kayıtlı!';return;}

ogrenciler.push({ad:a, sinif:s, tel:t, sifre:p, notlar:{}});
localStorage.setItem('ogr', JSON.stringify(ogrenciler));
m.className='mesaj basari';m.innerText='✓ Eklendi: '+a;
document.getElementById('ad').value='';
document.getElementById('tel').value='';
document.getElementById('sifre').value='';
}

function dersEkle(){
let s=document.getElementById('dsinif').value;
let d=document.getElementById('dersad').value.trim();
if(!d){alert('Ders yaz!');return;}
if(!dersler[s])dersler[s]=[];
if(dersler[s].includes(d)){alert('Ders var!');return;}
dersler[s].push(d);
localStorage.setItem('ders', JSON.stringify(dersler));
alert('Eklendi');
document.getElementById('dersad').value='';
dersListe();
}

function dersListe(){
let h='';
for(let k in dersler)h+=`<div class="ogr-kart"><b>${k}:</b> ${dersler[k].join(', ')}</div>`;
document.getElementById('dersliste').innerHTML=h||'Ders yok';
}

function listele(){
let h='';
if(ogrenciler.length==0){
  h='Öğrenci yok';
}else{
  ogrenciler.forEach((x,i)=>h+=`
    <div class="ogr-kart">
      ${x.sinif} - ${x.ad} - Tel:${x.tel} - Şifre:${x.sifre}
      <button class="kirmizi" style="float:right;padding:5px 10px;font-size:13px" onclick="sil(${i})">Sil</button>
      <div style="clear:both"></div>
    </div>
  `);
}
document.getElementById('list').innerHTML=h;
}

function sil(i){
if(confirm(ogrenciler[i].ad+' silinsin mi?')){
  ogrenciler.splice(i,1);
  localStorage.setItem('ogr', JSON.stringify(ogrenciler));
  alert('Silindi! Şimdi Yedek sekmesinden JSON indirip GitHub a yükle.');
  listele();
}
}

function ogrYukle(){
let s=document.getElementById('nsinif').value;
let d=ogrenciler.filter(x=>x.sinif==s);
let sel=document.getElementById('nogr');
sel.innerHTML='<option>Seç</option>';
d.forEach(x=>sel.innerHTML+=`<option>${x.ad}</option>`);
sel.onchange=dersYukle;
}

function dersYukle(){
let a=document.getElementById('nogr').value;
let o=ogrenciler.find(x=>x.ad==a);
let sel=document.getElementById('nders');
sel.innerHTML='<option>Seç</option>';
for(let d in o.notlar)sel.innerHTML+=`<option>${d}</option>`;
let s=document.getElementById('nsinif').value;
if(dersler[s])dersler[s].forEach(d=>sel.innerHTML+=`<option>${d}</option>`);
}

function notKaydet(){
let a=document.getElementById('nogr').value;
let d=document.getElementById('nders').value;
if(d=='Seç'){alert('Ders seç!');return;}
let i=ogrenciler.findIndex(x=>x.ad==a);
ogrenciler[i].notlar[d]={y1:document.getElementById('n1').value,y2:document.getElementById('n2').value,y3:document.getElementById('n3').value,y4:document.getElementById('n4').value};
localStorage.setItem('ogr', JSON.stringify(ogrenciler));
document.getElementById('mnot').className='mesaj basari';
document.getElementById('mnot').innerText='✓ Kaydedildi';
dersYukle();
}

function duyGonder(){
let s=document.getElementById('dusinif').value;
let b=document.getElementById('dbaslik').value;
let m=document.getElementById('dmetin').value;
if(!b||!m){alert('Doldur!');return;}
duyurular.push({sinif:s,baslik:b,metin:m,tarih:new Date().toLocaleDateString()});
localStorage.setItem('duy', JSON.stringify(duyurular));
document.getElementById('m5').className='mesaj basari';
document.getElementById('m5').innerText='✓ Yayınlandı';
document.getElementById('dbaslik').value='';
document.getElementById('dmetin').value='';
}

function indir(){download('ogrenciler.json', JSON.stringify(ogrenciler, null, 2));}
function indirDers(){download('dersler.json', JSON.stringify(dersler, null, 2));}
function indirDuyuru(){download('duyurular.json', JSON.stringify(duyurular, null, 2));}
function download(filename, text){
let a = document.createElement('a');
a.href = URL.createObjectURL(new Blob([text], {type: 'application/json'}));
a.download = filename; a.click();
}
</script>
</body>
</html>
