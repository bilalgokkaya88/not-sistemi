<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veli Panel</title>
<style>
body{font-family:Arial; margin:0; padding:20px; background:#f5f5f5}
.kutu{background:white; padding:20px; border-radius:10px; max-width:500px; margin:auto}
input,select,button{width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:5px}
button{background:#4CAF50; color:white; border:none; cursor:pointer}
button:hover{background:#45a049}
.not-karti{background:#e8f5e9; padding:10px; margin:5px 0; border-radius:5px}
.duyuru{background:#fff3cd; padding:10px; margin:5px 0; border-left:4px solid #ffc107}
.gizli{display:none}
</style>
</head>
<body>
<div class="kutu" id="giris">
<h2>Veli Girişi</h2>
<input type="tel" id="tel" placeholder="Telefon numarası">
<button onclick="girisYap()">Giriş Yap</button>
</div>

<div class="kutu gizli" id="panel">
<h2 id="ad"></h2>
<p>Sınıf: <span id="sinif"></span></p>

<h3>Duyurular</h3>
<div id="duyurular"></div>

<h3>Not Girişi</h3>
<select id="ders"></select>
<input type="number" id="y1" placeholder="1. Yazılı">
<input type="number" id="y2" placeholder="2. Yazılı">
<input type="number" id="y3" placeholder="3. Yazılı">
<input type="number" id="y4" placeholder="4. Yazılı">
<button onclick="notKaydet()">Kaydet</button>

<h3>Notlarım</h3>
<div id="notlar"></div>

<button onclick="cikis()">Çıkış</button>
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbz1YcHHcSBOjkvbwaq8SnNzH10i7XEOhv5xu4VNftOUJjHTMNPapjza3yqGatUddD_h/exec";
let aktifTel = '';
let aktifSinif = '';

function girisYap(){
  aktifTel = document.getElementById('tel').value.replace(/\s/g,'').replace(/-/g,'');
  fetch(URL + '?action=giris&tel=' + aktifTel)
 .then(r=>r.json())
 .then(res=>{
    if(res.status=='ok'){
      document.getElementById('giris').classList.add('gizli');
      document.getElementById('panel').classList.remove('gizli');
      document.getElementById('ad').innerText = res.ad;
      document.getElementById('sinif').innerText = res.sinif;
      aktifSinif = res.sinif;

      // Dersleri doldur
      let sel = document.getElementById('ders');
      sel.innerHTML = '';
      res.dersler.forEach(d=>{
        sel.innerHTML += `<option>${d}</option>`;
      });

      // Duyurular
      let dHtml = '';
      res.duyurular.forEach(d=>{
        dHtml += `<div class="duyuru"><b>${d.baslik}</b><br>${d.mesaj}</div>`;
      });
      document.getElementById('duyurular').innerHTML = dHtml || 'Duyuru yok';

      notlariGoster(res.notlar);
    } else {
      alert(res.msg);
    }
  });
}

function notlariGoster(notlar){
  let html = '';
  notlar.forEach(n=>{
    html += `<div class="not-karti"><b>${n.ders}</b><br>
    Y1:${n.y1||'-'} Y2:${n.y2||'-'} Y3:${n.y3||'-'} Y4:${n.y4||'-'} Ortalama:${n.ort||'-'}</div>`;
  });
  document.getElementById('notlar').innerHTML = html || 'Not yok';
}

function notKaydet(){
  let data = {
    action:'notKaydet',
    tel: aktifTel,
    ders: document.getElementById('ders').value,
    y1: document.getElementById('y1').value,
    y2: document.getElementById('y2').value,
    y3: document.getElementById('y3').value,
    y4: document.getElementById('y4').value
  };

  fetch(URL, {
    method:'POST',
    body: JSON.stringify(data)
  }).then(r=>r.json()).then(res=>{
    if(res.status=='ok'){
      alert('Kaydedildi');
      girisYap(); // Listeyi yenile
    }
  });
}

function cikis(){
  document.getElementById('panel').classList.add('gizli');
  document.getElementById('giris').classList.remove('gizli');
  document.getElementById('tel').value = '';
}
</script>
</body>
</html>
