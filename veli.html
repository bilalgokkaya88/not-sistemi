<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veli Bilgilendirme</title>
<style>
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);margin:0;padding:20px;min-height:100vh}
.container{max-width:700px;margin:0 auto;background:#fff;border-radius:20px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{text-align:center;color:#667eea;margin-bottom:10px}
.login-box{text-align:center}
input{width:100%;padding:15px;margin:10px 0;border:2px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:15px;background:#667eea;color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}
button:hover{background:#5568d3}
#app{display:none}
.welcome{background:#e8f4fd;padding:15px;border-radius:10px;margin-bottom:20px;text-align:center;font-size:18px;color:#0066cc;font-weight:bold}
.panel{background:#f8f9fa;border-left:5px solid #667eea;padding:15px;margin:15px 0;border-radius:8px}
.panel h3{margin-top:0;color:#667eea}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #ddd}
th{background:#667eea;color:#fff}
.error{color:red;text-align:center;margin-top:10px;font-weight:bold}
.duyuru-item{background:#fff;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd}
.duyuru-tarih{font-size:12px;color:#888}
</style>
</head>
<body>
<div class="container">
  <h1>📚 Veli Bilgilendirme Sistemi</h1>
  
  <div id="login" class="login-box">
    <p>Telefon numaranızı giriniz</p>
    <input type="tel" id="tel" placeholder="0535..." maxlength="11">
    <button onclick="giris()">Giriş Yap</button>
    <div id="hata" class="error"></div>
  </div>

  <div id="app">
    <div id="welcome" class="welcome"></div>
    
    <div id="diniPanel" class="panel" style="display:none">
      <h3>🕌 Dini Ders Notu</h3>
      <div id="diniIcerik"></div>
    </div>

    <div id="sinavPanel" class="panel" style="display:none">
      <h3>📝 Sınav Notları</h3>
      <div id="sinavIcerik"></div>
    </div>

    <div id="dersPanel" class="panel" style="display:none">
      <h3>📖 Ders Programı</h3>
      <div id="dersIcerik"></div>
    </div>

    <div id="duyuruPanel" class="panel" style="display:none">
      <h3>📢 Duyurular</h3>
      <div id="duyuruIcerik"></div>
    </div>

    <button onclick="cikis()">Çıkış Yap</button>
  </div>
</div>

<script>
// BURAYA KENDİ LİNKİNİ YAPIŞTIR
const API_URL = 'https://script.google.com/macros/s/AKfycbzVaV0pH0BwhMNTm-Yz77HVeIdS-3Lju0dKNZzq1Kv2ZVtSDzIdOGNPB6BmV4HQSiy1/exec';

function giris(){
  var tel = document.getElementById('tel').value.replace(/\s/g,'').replace(/-/g,'');
  document.getElementById('hata').innerText = '';
  
  if(tel.length < 10){
    document.getElementById('hata').innerText = 'Geçerli telefon giriniz';
    return;
  }

  document.getElementById('hata').innerText = 'Yükleniyor...';
  
  // JSONP ile veri çek
  var script = document.createElement('script');
  script.src = API_URL + '?callback=kullaniciYuklendi&no=' + tel;
  script.onerror = function(){
    document.getElementById('hata').innerText = 'Bağlantı hatası. Linki kontrol edin.';
  }
  document.body.appendChild(script);
}

// BU FONKSİYON ADI KOD.GS İLE AYNI OLMALI
function kullaniciYuklendi(data){
  console.log("GELEN VERİ:", data); // Debug için
  
  document.getElementById('hata').innerText = '';
  
  if(!data.ad || data.ad == ''){
    document.getElementById('hata').innerText = 'Kayıt bulunamadı';
    return;
  }

  // Girişi gizle, app'i göster
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  // Hoş geldin
  document.getElementById('welcome').innerText = 'Hoş geldin ' + data.ad + ' - Sınıf: ' + data.sinif;

  // 1. DİNİ DERS
  if(data.diniDers && data.diniDers != ''){
    document.getElementById('diniPanel').style.display = 'block';
    document.getElementById('diniIcerik').innerHTML = '<b>Not:</b> ' + data.diniDers;
  }

  // 2. SINAV NOTLARI
  if(data.sinavlar && data.sinavlar.length > 0){
    document.getElementById('sinavPanel').style.display = 'block';
    var html = '<table><tr><th>Ders</th><th>1.Yaz</th><th>2.Yaz</th><th>3.Yaz</th><th>4.Yaz</th><th>Ort</th></tr>';
    data.sinavlar.forEach(function(s){
      html += '<tr><td>'+s.ders+'</td><td>'+s.yaz1+'</td><td>'+s.yaz2+'</td><td>'+s.yaz3+'</td><td>'+s.yaz4+'</td><td><b>'+s.ort+'</b></td></tr>';
    });
    html += '</table>';
    document.getElementById('sinavIcerik').innerHTML = html;
  }

  // 3. DERSLER
  if(data.dersler && data.dersler.length > 0){
    document.getElementById('dersPanel').style.display = 'block';
    var html = '<ul>';
    data.dersler.forEach(function(d){
      html += '<li>'+d+'</li>';
    });
    html += '</ul>';
    document.getElementById('dersIcerik').innerHTML = html;
  }

  // 4. DUYURULAR
  if(data.duyurular && data.duyurular.length > 0){
    document.getElementById('duyuruPanel').style.display = 'block';
    var html = '';
    data.duyurular.forEach(function(d){
      html += '<div class="duyuru-item"><div class="duyuru-tarih">'+d.tarih+'</div><b>'+d.baslik+'</b><br>'+d.mesaj+'</div>';
    });
    document.getElementById('duyuruIcerik').innerHTML = html;
  }
}

function cikis(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'block';
  document.getElementById('tel').value = '';
  document.getElementById('hata').innerText = '';
}
</script>
</body>
</html>
