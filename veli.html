<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Veli Giriş</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#667eea;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial}
.kutu{background:white;padding:30px;border-radius:15px;width:90%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
h2{color:#667eea;text-align:center}
input{width:100%;padding:12px;margin:10px 0;border:2px solid #ddd;border-radius:8px;box-sizing:border-box;font-size:16px}
button{width:100%;padding:14px;background:#667eea;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
.hata{color:red;background:#ffe6e6;padding:10px;border-radius:8px;margin-top:10px;text-align:center;display:none}
</style>
</head>
<body>
<div class="kutu">
<h2>Veli Giriş</h2>
<input type="text" id="ad" placeholder="Öğrenci Ad Soyad">
<input type="password" id="sifre" placeholder="Şifre">
<button onclick="giris()">Giriş Yap</button>
<div id="hata" class="hata">Bilgiler hatalı!</div>
<div id="sonuc" style="margin-top:20px"></div>
</div>
<script>
function giris(){
let ad=document.getElementById('ad').value.trim().toLowerCase();
let sifre=document.getElementById('sifre').value.trim();
let veri=localStorage.getItem('ogrenciler')||localStorage.getItem('ogrenciler_v6')||'[]';
let ogrenciler=JSON.parse(veri);
let ogr=ogrenciler.find(o=>o.ad.toLowerCase()===ad && o.sifre===sifre);
if(!ogr){document.getElementById('hata').style.display='block';return;}
document.getElementById('hata').style.display='none';
let html='<h3>'+ogr.ad+'</h3><p>Sınıf: '+ogr.sinif+'</p>';
if(ogr.notlar && ogr.notlar.length>0){ogr.notlar.forEach(n=>{html+='<p>'+n.ders+': '+n.puan+'</p>';});}else{html+='<p>Not yok</p>';}
document.getElementById('sonuc').innerHTML=html;
}
</script>
</body>
</html>
