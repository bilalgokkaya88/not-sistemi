<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Veli Panel - 4 Yazılı</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#667eea;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial;padding:20px}
.kutu{background:white;padding:25px;border-radius:15px;width:100%;max-width:480px}
h2{color:#667eea;text-align:center;margin-top:0}
input{width:100%;padding:12px;margin:6px 0;border:2px solid #ddd;border-radius:8px;box-sizing:border-box;font-size:16px}
button{width:100%;padding:14px;background:#4caf50;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.hata{color:red;background:#ffe6e6;padding:10px;border-radius:8px;margin-top:10px;text-align:center;display:none}
.ders-kart{border:2px solid #667eea;padding:15px;margin:10px 0;border-radius:10px;background:#f8f9ff}
.ort{font-size:20px;font-weight:bold;color:#4caf50;text-align:center;margin-top:10px}
.btn-sil{padding:5px 10px;background:#f44336;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;float:right}
.bolum{border-top:2px solid #eee;padding-top:15px;margin-top:15px}
</style>
</head>
<body>
<div class="kutu">
<h2>📝 Veli Not Paneli</h2>

<div id="giris">
<input type="text" id="ad" placeholder="Öğrenci Ad Soyad">
<input type="password" id="sifre" placeholder="Şifre">
<button onclick="girisYap()" style="background:#667eea">Giriş Yap</button>
<div id="hata" class="hata">Bilgiler hatalı!</div>
</div>

<div id="panel" style="display:none">
<h3 id="ogrAd"></h3>
<p id="ogrSinif"></p>

<div class="bolum">
<h4>1. Ders Ekle</h4>
<input type="text" id="yeniDers" placeholder="Ders adı - Örn: Matematik">
<button onclick="dersEkle()">Ders Ekle</button>
</div>

<div class="bolum">
<h4>2. Not Gir - 4 Yazılı</h4>
<div id="dersler"></div>
</div>

<button onclick="cikisYap()" style="background:#999;margin-top:15px">Çıkış Yap</button>
</div>
</div>

<script>
let aktifOgr = null;
let aktifIndex = null;
const STORAGE_KEY = 'ogrenciler_v6';

function ogrencileriGetir(){
let veri = localStorage.getItem(STORAGE_KEY) || '[]';
try{return JSON.parse(veri);}catch(e){return [];}
}

function ogrencileriKaydet(liste){
localStorage.setItem(STORAGE_KEY, JSON.stringify(liste));
}

function girisYap(){
let ad = document.getElementById('ad').value.trim().toLowerCase();
let sifre = document.getElementById('sifre').value.trim();
document.getElementById('hata').style.display = 'none';

let ogrenciler = ogrencileriGetir();
aktifIndex = ogrenciler.findIndex(o => o.ad.toLowerCase() === ad && o.sifre === sifre);

if(aktifIndex === -1){document.getElementById('hata').style.display = 'block';return;}

aktifOgr = ogrenciler[aktifIndex];
if(!aktifOgr.dersler) aktifOgr.dersler = [];
if(!aktifOgr.notlar) aktifOgr.notlar = {};

document.getElementById('giris').style.display = 'none';
document.getElementById('panel').style.display = 'block';
document.getElementById('ogrAd').innerText = aktifOgr.ad;
document.getElementById('ogrSinif').innerText = aktifOgr.sinif;
dersleriListele();
}

function dersEkle(){
let dersAdi = document.getElementById('yeniDers').value.trim();
if(!dersAdi){alert('Ders adı yazın');return;}

let ogrenciler = ogrencileriGetir();
if(ogrenciler[aktifIndex].dersler.includes(dersAdi)){
alert('Bu ders zaten var');
return;
}

ogrenciler[aktifIndex].dersler.push(dersAdi);
ogrenciler[aktifIndex].notlar[dersAdi] = {y1:'', y2:'', y3:'', y4:''};
ogrencileriKaydet(ogrenciler);
aktifOgr = ogrenciler[aktifIndex];

document.getElementById('yeniDers').value = '';
dersleriListele();
}

function notKaydet(ders, yazili){
let deger = document.getElementById(ders+'_'+yazili).value;
if(deger!=='' && (deger < 0 || deger > 100)){alert('0-100 arası girin');return;}
let ogrenciler = ogrencileriGetir();
ogrenciler[aktifIndex].notlar[yazili] = deger;
ogrencileriKaydet(ogrenciler);
aktifOgr = ogrenciler[aktifIndex];
dersleriListele();
}

function dersSil(ders){
if(!confirm(ders+' dersini silmek istiyor musun?')) return;
let ogrenciler = ogrencileriGetir();
ogrenciler[aktifIndex].dersler = ogrenciler[aktifIndex].dersler.filter(d => d!== ders);
delete ogrenciler[aktifIndex].notlar;
ogrencileriKaydet(ogrenciler);
aktifOgr = ogrenciler[aktifIndex];
dersleriListele();
}

function ortalamaHesapla(notlar){
let notlarArr = [notlar.y1, notlar.y2, notlar.y3, notlar.y4].filter(n => n!== '' &&!isNaN(n)).map(Number);
if(notlarArr.length === 0) return '-';
let ort = notlarArr.reduce((a,b) => a+b, 0) / notlarArr.length;
return ort.toFixed(1);
}

function dersleriListele(){
let html = '';
if(aktifOgr.dersler.length === 0){
html = 'Henüz ders eklenmemiş';
}else{
aktifOgr.dersler.forEach(ders => {
let not = aktifOgr.notlar || {y1:'', y2:'', y3:'', y4:''};
let ort = ortalamaHesapla(not);
html += `<div class="ders-kart">
<b>${ders}</b> <button class="btn-sil" onclick="dersSil('${ders}')">Sil</button>
<input type="number" id="${ders}_y1" min="0" max="100" placeholder="1. Yazılı" value="${not.y1}" onchange="notKaydet('${ders}','y1')">
<input type="number" id="${ders}_y2" min="0" max="100" placeholder="2. Yazılı" value="${not.y2}" onchange="notKaydet('${ders}','y2')">
<input type="number" id="${ders}_y3" min="0" max="100" placeholder="3. Yazılı" value="${not.y3}" onchange="notKaydet('${ders}','y3')">
<input type="number" id="${ders}_y4" min="0" max="100" placeholder="4. Yazılı" value="${not.y4}" onchange="notKaydet('${ders}','y4')">
<div class="ort">ORTALAMA: ${ort}</div>
</div>`;
});
}
document.getElementById('dersler').innerHTML = html;
}

function cikisYap(){
aktifOgr = null;
aktifIndex = null;
document.getElementById('panel').style.display = 'none';
document.getElementById('giris').style.display = 'block';
document.getElementById('ad').value = '';
document.getElementById('sifre').value = '';
}
</script>
</body>
</html>
