<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial; padding:20px; background:#f5f5f5}
.kutu{background:white; padding:20px; border-radius:10px; max-width:500px; margin:auto; margin-top:30px}
input,button{width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:5px; font-size:16px}
button{background:#25D366; color:white; border:none; font-weight:bold; cursor:pointer}
.panel{margin-top:15px; padding:15px; background:#e8f5e9; border-radius:8px; display:none}
.panel h3{color:#25D366; margin-top:0}
.ad{font-size:18px; font-weight:bold; color:#25D366}
</style>
</head>
<body>

<div class="kutu" id="giris">
  <h2>📱 Veli Giriş</h2>
  <input type="tel" id="tel" placeholder="Telefon 0535...">
  <button onclick="girisYap()">Giriş Yap</button>
  <p id="hata" style="color:red"></p>
  <p id="bilgi" class="ad"></p>
</div>

<div class="kutu" id="panel" style="display:none">
  
  <div class="panel" id="diniPanel">
    <h3>📖 Dini Ders Notu</h3>
    <div id="dini"></div>
  </div>
  
  <div class="panel" id="sinavPanel">
    <h3>📝 Sınav Notları</h3>
    <div id="sinav"></div>
  </div>
  
  <div class="panel" id="dersPanel">
    <h3>📚 Ders Listesi</h3>
    <div id="ders"></div>
  </div>
  
  <div class="panel" id="duyuruPanel">
    <h3>📢 Duyurular</h3>
    <div id="duyuru"></div>
  </div>
</div>

<script>
var API_LINK = "https://script.google.com/macros/s/AKfycbyATlcjZfGQDaCvfh3X7mUOIwES4Ibj1Ojg_qAaeFEEVz7gAfMjniA30DjxdX0hyInE/exec";

function girisYap(){
  var tel = document.getElementById('tel').value.trim().replace(/\s/g,'');
  document.getElementById('hata').innerText = '';
  document.getElementById('bilgi').innerText = 'Yükleniyor...';
  
  var script = document.createElement('script');
  script.src = API_LINK + '?no=' + tel + '&callback=goster';
  document.body.appendChild(script);
}

function goster(data){
  if(data.error){
    document.getElementById('bilgi').innerText = '';
    document.getElementById('hata').innerText = data.error;
    return;
  }
  
  document.getElementById('giris').style.display='none';
  document.getElementById('panel').style.display='block';
  document.getElementById('bilgi').innerText = 'Hoş geldin ' + data.ad + ' - Sınıf: ' + data.sinif;
  
  // 1. Dini Ders - E sütunu
  if(data.diniDers){
    document.getElementById('diniPanel').style.display='block';
    document.getElementById('dini').innerText = data.diniDers;
  }
  
  // 2. Sınav Notları - F,G,H,I sütunları
  if(data.sinavlar && data.sinavlar.length>0){
    document.getElementById('sinavPanel').style.display='block';
    var html = '';
    data.sinavlar.forEach(n => html += n.ders + ': ' + n.not + '<br>');
    document.getElementById('sinav').innerHTML = html;
  } else {
    document.getElementById('sinav').innerText = 'Henüz not girilmemiş';
  }
  
  // 3. Dersler - Dersler sayfası A sütunu
  if(data.dersler && data.dersler.length>0){
    document.getElementById('dersPanel').style.display='block';
    document.getElementById('ders').innerHTML = data.dersler.map(d => '• ' + d).join('<br>');
  }
  
  // 4. Duyurular - Duyurular sayfası
  if(data.duyurular && data.duyurular.length>0){
    document.getElementById('duyuruPanel').style.display='block';
    var html = '';
    data.duyurular.forEach(d => html += '<b>' + d.baslik + '</b><br>' + d.mesaj + '<br><br>');
    document.getElementById('duyuru').innerHTML = html;
  }
}
</script>
</body>
</html>
