<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Veli Bilgilendirme Sistemi</title>
<style>
body {font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px;}
.container {max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
h2 {color: #2c3e50; text-align: center;}
input, button {padding: 12px; font-size: 16px; margin: 5px 0; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc;}
button {background: #3498db; color: white; border: none; cursor: pointer;}
button:hover {background: #2980b9;}
.panel {margin-top: 20px; padding: 15px; border-radius: 8px; border-left: 5px solid #3498db; background: #ecf6fd;}
.panel h3 {margin-top: 0; color: #2c3e50;}
table {width: 100%; border-collapse: collapse; margin-top: 10px;}
table th, table td {border: 1px solid #ddd; padding: 8px; text-align: center;}
table th {background: #3498db; color: white;}
.error {color: red; text-align: center; margin-top: 10px;}
</style>
</head>
<body>
<div class="container">
  <h2>📘 Veli Bilgilendirme Sistemi</h2>
  
  <!-- GİRİŞ KISMI -->
  <div id="loginDiv">
    <input type="text" id="telefon" placeholder="Telefon numarası yazınız - Örn: 05354611029">
    <button onclick="girisYap()">Giriş Yap</button>
    <div id="hata" class="error"></div>
  </div>

  <!-- PANELLER - GİRİŞTEN SONRA GÖRÜNECEK -->
  <div id="sonucDiv" style="display:none">
    <h2 id="welcomeText"></h2>
    <button onclick="cikisYap()">Çıkış Yap</button>
    
    <!-- 1. DİNİ DERS PANELİ -->
    <div id="diniPanel" class="panel" style="display:none; border-left-color:#27ae60; background:#eaf1">
      <h3>📿 Dini Ders Notu</h3>
      <div id="diniIcerik"></div>
    </div>

    <!-- 2. SINAV NOTLARI PANELİ -->
    <div id="sinavPanel" class="panel" style="display:none; border-left-color:#8e44ad; background:#f5eef8">
      <h3>📝 Sınav Notları</h3>
      <div id="sinavIcerik"></div>
    </div>

    <!-- 3. DERSLER PANELİ -->
    <div id="dersPanel" class="panel" style="display:none; border-left-color:#e67e22; background:#fef5e7">
      <h3>📚 Dersler</h3>
      <div id="dersIcerik"></div>
    </div>

    <!-- 4. DUYURULAR PANELİ -->
    <div id="duyuruPanel" class="panel" style="display:none; border-left-color:#c0392b; background:#fdedec">
      <h3>📢 Duyurular</h3>
      <div id="duyuruIcerik"></div>
    </div>
  </div>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycby_nWz8BuRgEqDxn2953iKbsrbVHb_wcdqxdXLym-UwlFUXf0Etpx0a0OWH00IMIPVs/exec'; // Kod.gs > Dağıt > Yeni dağıtım linkini yapıştır

function girisYap(){
  var tel = document.getElementById('telefon').value.trim();
  if(!tel){ document.getElementById('hata').innerText = 'Telefon numarası giriniz'; return; }
  
  document.getElementById('hata').innerText = 'Yükleniyor...';
  
  fetch(API_URL + '?no=' + tel)
  .then(r => r.json())
  .then(data => {
    if(data.hata){
      document.getElementById('hata').innerText = data.hata;
      return;
    }
    
    // Giriş kısmını gizle, panelleri göster
    document.getElementById('loginDiv').style.display = 'none';
    document.getElementById('sonucDiv').style.display = 'block';
    document.getElementById('welcomeText').innerText = 'Hoş geldin ' + data.ad + ' - Sınıf: ' + data.sinif;
    
    // 1. DİNİ DERS
    if(data.diniDers){
      document.getElementById('diniPanel').style.display = 'block';
      document.getElementById('diniIcerik').innerText = data.diniDers;
    }
    
    // 2. SINAV NOTLARI - TABLO
    if(data.sinavlar && data.sinavlar.length > 0){
      document.getElementById('sinavPanel').style.display = 'block';
      var tablo = '<table><tr><th>Ders</th><th>1.Yaz</th><th>2.Yaz</th><th>3.Yaz</th><th>4.Yaz</th><th>Ortalama</th></tr>';
      data.sinavlar.forEach(function(s){
        tablo += '<tr><td>'+s.ders+'</td><td>'+s.yaz1+'</td><td>'+s.yaz2+'</td><td>'+s.yaz3+'</td><td>'+s.yaz4+'</td><td><b>'+s.ort+'</b></td></tr>';
      });
      tablo += '</table>';
      document.getElementById('sinavIcerik').innerHTML = tablo;
    }
    
    // 3. DERSLER - LİSTE
    if(data.dersler && data.dersler.length > 0){
      document.getElementById('dersPanel').style.display = 'block';
      var liste = '<ul>';
      data.dersler.forEach(function(d){ liste += '<li>'+d+'</li>'; });
      liste += '</ul>';
      document.getElementById('dersIcerik').innerHTML = liste;
    }
    
    // 4. DUYURULAR
    if(data.duyurular && data.duyurular.length > 0){
      document.getElementById('duyuruPanel').style.display = 'block';
      var duyuruHtml = '';
      data.duyurular.forEach(function(d){
        duyuruHtml += '<div style="margin-bottom:10px;padding:8px;border-bottom:1px dashed #ccc"><b>'+d.baslik+'</b><br><small>'+d.tarih+'</small><br>'+d.mesaj+'</div>';
      });
      document.getElementById('duyuruIcerik').innerHTML = duyuruHtml;
    }
    
  })
  .catch(err => {
    document.getElementById('hata').innerText = 'Hata: ' + err;
  });
}

function cikisYap(){
  document.getElementById('sonucDiv').style.display = 'none';
  document.getElementById('loginDiv').style.display = 'block';
  document.getElementById('telefon').value = '';
  document.getElementById('hata').innerText = '';
}
</script>
</body>
</html>
