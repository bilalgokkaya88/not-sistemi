<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yazılı Not Giriş</title>
<style>
body{font-family:Arial,sans-serif;background:#1e3a8a;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.2);width:320px}
h2{text-align:center;margin-bottom:20px;color:#1e3a8a}
label{display:block;margin:10px 0 5px;font-weight:bold}
input,select,button{width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{background:#2563eb;color:#fff;border:none;cursor:pointer;font-size:16px}
button:hover{background:#1d4ed8}
#notPanel{display:none}
</style>
</head>
<body>
<div class="box">
  <div id="girisPanel">
    <h2>Yazılı Not Giriş</h2>
    <label>Telefon No:</label>
    <input type="text" id="ogrNo" placeholder="05354611015" autocomplete="tel">
    <button id="btnGiris">Giriş Yap</button>
  </div>

  <div id="notPanel">
    <h2>Not Giriş</h2>
    <label>Sınıf:</label>
    <select id="sinif"></select>
    <label>Not:</label>
    <input type="number" id="not" placeholder="85">
    <button id="btnKaydet">Kaydet</button>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/library/d/15KrKSVLnYu81R02L1xizyz05XLDZ0Lo0lIREyi0VdlwRRYDQMDIJao-O/28';

document.getElementById('btnGiris').addEventListener('click', async () => {
  let telNo = document.getElementById('ogrNo').value.trim();

  if(telNo == ''){
    alert('Telefon numarası girin');
    return;
  }

  try {
    const resp = await fetch(SCRIPT_URL + '?action=login&no=' + telNo);
    const data = await resp.json();

    if(data.sinif){
      document.getElementById('sinif').innerHTML = '<option>'+data.sinif+'</option>';
      document.getElementById('girisPanel').style.display = 'none';
      document.getElementById('notPanel').style.display = 'block';
      alert('Hoş geldin ' + data.veli);
    } else if(data.hata == 'bulunamadı'){
      alert('Kayıt bulunamadı. Telefon numarasını kontrol edin.');
    } else {
      alert('Hata: ' + data.hata);
    }
  } catch(e){
    alert('Bağlantı hatası. Apps Script iznini kontrol edin.');
  }
});
</script>
</body>
</html>
