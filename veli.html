<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not Giriş Sistemi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
.kutu{max-width:600px;margin:50px auto;background:white;border-radius:15px;padding:30px;box-shadow:0 10px 40px rgba(0,0,0,0.3)}
h2{text-align:center;color:#333;margin-bottom:25px}
label{display:block;margin-top:15px;font-weight:600;color:#555}
input,select{width:100%;padding:12px;margin-top:5px;border:2px solid #ddd;border-radius:8px;font-size:16px}
input:focus,select:focus{border-color:#667eea;outline:none}
button{width:100%;padding:14px;margin-top:20px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
button:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(102,126,234,0.4)}
button:disabled{background:#ccc;cursor:not-allowed}
.ortalama{font-size:24px;text-align:center;margin:20px 0;padding:15px;background:#f0f0ff;border-radius:8px;color:#667eea;font-weight:bold}
.sonuc{margin-top:15px;padding:12px;border-radius:8px;text-align:center;font-weight:600}
.sonuc.basari{background:#d4edda;color:#155724}
#notPanel{display:none}
</style>
</head>
<body>
<div class="kutu">
<h2>Not Giriş Sistemi</h2>

<div id="girisPanel">
<label>Öğrenci No:</label>
<input type="text" id="ogrNo" placeholder="Öğrenci numaranızı girin">
<button onclick="girisYap()">Giriş Yap</button>
</div>

<div id="notPanel">
<label>Sınıf:</label>
<select id="sinif">
<option value="">Sınıf Seçin</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
<option>11</option>
<option>12</option>
</select>

<label>Ders:</label>
<select id="ders">
<option value="">Ders Seçin</option>
<option>Matematik</option>
<option>Türkçe</option>
<option>Fen Bilimleri</option>
<option>Sosyal Bilgiler</option>
<option>İngilizce</option>
<option>Din Kültürü</option>
<option>Beden Eğitimi</option>
<option>Kimya</option>
<option>Fizik</option>
<option>Biyoloji</option>
<option>Tarih</option>
<option>Coğrafya</option>
</select>

<label>1. Yazılı:</label>
<input type="number" id="n1" min="0" max="100" oninput="hesapla()">

<label>2. Yazılı:</label>
<input type="number" id="n2" min="0" max="100" oninput="hesapla()">

<label>3. Yazılı:</label>
<input type="number" id="n3" min="0" max="100" oninput="hesapla()">

<label>4. Yazılı:</label>
<input type="number" id="n4" min="0" max="100" oninput="hesapla()">

<div class="ortalama">Ortalama: <span id="ort">0.00</span></div>

<button id="gonderBtn" onclick="gonder()">Gönder</button>
<div id="sonuc"></div>
</div>

</div>

<script>
let ogrNo = '';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzCDzFRA7P9-V_NXc9kpoT_8m6cxNaGGJSKYVjA8iay77quhxbmOMhKCNvmxibn0GdB/exec';

function girisYap(){
ogrNo = document.getElementById('ogrNo').value.trim();
if(!ogrNo){ alert('Öğrenci no girin'); return; }
document.getElementById('girisPanel').style.display = 'none';
document.getElementById('notPanel').style.display = 'block';
}

function hesapla(){
const n1 = parseFloat(document.getElementById('n1').value) || 0;
const n2 = parseFloat(document.getElementById('n2').value) || 0;
const n3 = parseFloat(document.getElementById('n3').value) || 0;
const n4 = parseFloat(document.getElementById('n4').value) || 0;
const ort = ((n1+n2+n3+n4)/4).toFixed(2);
document.getElementById('ort').textContent = ort;
}

async function gonder(){
const sinif = document.getElementById('sinif').value;
const ders = document.getElementById('ders').value;
const n1 = document.getElementById('n1').value;
const n2 = document.getElementById('n2').value;
const n3 = document.getElementById('n3').value;
const n4 = document.getElementById('n4').value;
const ort = document.getElementById('ort').textContent;

if(!sinif){ alert('Sınıf seçin'); return; }
if(!ders){ alert('Ders seçin'); return; }
if(!n1 || !n2 || !n3 || !n4){ alert('4 notu da girin'); return; }

const btn = document.getElementById('gonderBtn');
btn.disabled = true;
btn.textContent = 'Gönderiliyor...';

try{
await fetch(SCRIPT_URL, {
method: 'POST',
mode: 'no-cors',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({ogrNo, sinif, ders, n1, n2, n3, n4, ort})
});
document.getElementById('sonuc').innerHTML = '<div class="sonuc basari">Notlar başarıyla gönderildi!</div>';
setTimeout(() => location.reload(), 2000);
}catch(err){
alert('Hata oluştu');
btn.disabled = false;
btn.textContent = 'Gönder';
}
</script>
</body>
</html>
