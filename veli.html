<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Not Giriş Sistemi</title>
<style>
body{font-family:Arial;background:#667eea;padding:50px}
.kutu{background:white;padding:30px;border-radius:10px;max-width:400px;margin:auto}
input,select{width:100%;padding:10px;margin:10px 0}
button{width:100%;padding:12px;background:#667eea;color:white;border:none;cursor:pointer}
#notPanel{display:none}
</style>
</head>
<body>
<div class="kutu">
<div id="girisPanel">
<h2>Not Giriş Sistemi</h2>
<input type="text" id="ogrNo" placeholder="Öğrenci No">
<button id="btnGiris">Giriş Yap</button>
</div>

<div id="notPanel">
<h3>Not Giriş</h3>
<select id="sinif"><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select>
<select id="ders"><option>Matematik</option><option>Türkçe</option></select>
<input type="number" id="n1" placeholder="1.Yazılı">
<input type="number" id="n2" placeholder="2.Yazılı">
<input type="number" id="n3" placeholder="3.Yazılı">
<input type="number" id="n4" placeholder="4.Yazılı">
<button id="btnGonder">Gönder</button>
<div id="sonuc"></div>
</div>
</div>

<script>
document.getElementById('btnGiris').addEventListener('click', function(){
const no = document.getElementById('ogrNo').value.trim();
if(no == ''){ alert('Öğrenci no girin'); return; }
document.getElementById('girisPanel').style.display = 'none';
document.getElementById('notPanel').style.display = 'block';
});

document.getElementById('btnGonder').addEventListener('click', function(){
alert('Gönder butonu çalıştı. Apps Script linkini ekleyeceğiz.');
});
</script>
</body>
</html>
