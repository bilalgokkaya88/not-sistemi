<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Veli Paneli v38</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#667eea;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:15px}
.kutu{background:white;padding:25px;border-radius:15px;width:100%;max-width:450px}
h2{text-align:center;color:#667eea;margin:0 0 20px 0}
input{width:100%;padding:14px;margin:10px 0;border:2px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:15px;background:#4caf50;color:white;border:none;border-radius:10px;font-size:18px;font-weight:bold}
.not-kart{background:#f8f9ff;border:2px solid #667eea;padding:12px;margin:10px 0;border-radius:10px}
.hata{color:red;text-align:center;margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<div class="kutu" id="giris">
<h2>📱 Veli Girişi v38</h2>
<input id="tel" type="tel" placeholder="Telefon 05510447940" inputmode="numeric">
<input id="sifre" type="password" placeholder="Şifre">
<button onclick="giris()">Giriş Yap</button>
<div id="hata" class="hata"></div>
</div>

<div class="kutu" id="panel" style="display:none">
<h2><span id="ogrAd"></span></h2>
<p><b>Sınıf:</b> <span id="ogrSinif"></span></p>
<div id="duyuru"></div>
<h3>📊 Notlar</h3>
<div id="notlar"></div>
<button onclick="cikis()" style="background:#f44336;margin-top:15px">Çıkış</button>
</div>

<script>
let ogrenciler=[];
let duyurular=[];

fetch('ogrenciler.json?v='+Date.now()).then(r=>r.json()).then(d=>ogrenciler=d).catch(()=>{});
fetch('duyurular.json?v='+Date.now()).then(r=>r.json()).then(d=>duyurular=d).catch(()=>{});

function giris(){
let tel=document.getElementById('tel').value.replace(/\s/g,'');
if(tel.length==10 && tel[0]!='0') tel = '0' + tel;
let sifre=document.getElementById('sifre').value.trim();

let o=ogrenciler.find(x=>x.tel==tel && x.sifre==sifre);
if(o){
document.getElementById('giris').style.display='none';
document.getElementById('panel').style.display='block';
document.getElementById('ogrAd').innerText=o.ad;
document.getElementById('ogrSinif').innerText=o.sinif;
notGoster(o);
duyGoster(o.sinif);
}else{
document.getElementById('hata').innerText='Telefon veya şifre hatalı!';
}
}

function notGoster(o){
let h='';
for(let d in o.notlar){
let n=o.notlar[d];
let arr=[n.y1,n.y2,n.y3,n.y4].filter(x=>x!='').map(Number);
let ort=arr.length?(arr.reduce((a,b)=>a+b)/arr.length).toFixed(1):'-';
h+=`<div class="not-kart"><b>${d}</b><br>1:${n.y1||'-'} 2:${n.y2||'-'} 3:${n.y3||'-'} 4:${n.y4||'-'}<br><b>Ortalama: ${ort}</b></div>`;
}
document.getElementById('notlar').innerHTML=h||'Henüz not girilmemiş';
}

function duyGoster(sinif){
let son=duyurular.filter(x=>x.sinif==sinif).pop();
if(son)document.getElementById('duyuru').innerHTML=`<div style="background:#fff3e0;border-left:4px solid #ff9800;padding:10px;margin:10px 0;border-radius:6px"><b>📢 ${son.baslik}</b><br>${son.metin}<br><small>${son.tarih}</small></div>`;
}

function cikis(){
document.getElementById('panel').style.display='none';
document.getElementById('giris').style.display='block';
document.getElementById('tel').value='';
document.getElementById('sifre').value='';
document.getElementById('hata').innerText='';
}
</script>
</body>
</html>
