<script>
var URL = 'https://script.google.com/macros/s/AKfycbx_nqBwQv0Wef56RABFLlp-3tJq7SKDzIsGZdBAdtbcmKaRWSMAWMEj6eBes3fvAUap/exec';
var aktifTel = '';
var aktifAd = '';
var aktifSinif = '';

function girisYap() {
  aktifTel = document.getElementById('tel').value;
  fetch(URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: 'giris', tel: aktifTel})
  })
 .then(r => r.json())
 .then(res => {
    if(res.status === 'ok') {
      aktifAd = res.ad;
      aktifSinif = res.sinif;
      document.getElementById('ad').innerText = aktifAd;
      document.getElementById('sinif').innerText = aktifSinif;
      dersleriYukle();
      notlariYukle();
      duyurulariYukle();
    } else {
      alert(res.mesaj);
    }
  });
}

function dersleriYukle() {
  fetch(URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: 'dersleriGetir', sinif: aktifSinif})
  })
 .then(r => r.json())
 .then(res => {
    let select = document.getElementById('ders');
    select.innerHTML = '<option>Seçiniz</option>';
    res.dersler.forEach(d => {
      select.innerHTML += `<option value="${d}">${d}</option>`;
    });
  });
}

function notKaydet() {
  var data = {
    action: 'notKaydet',
    tel: aktifTel,
    ad: aktifAd,
    sinif: aktifSinif,
    ders: document.getElementById('ders').value,
    not1: document.getElementById('not1').value,
    not2: document.getElementById('not2').value,
    not3: document.getElementById('not3').value,
    not4: document.getElementById('not4').value
  };

  fetch(URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  })
 .then(r => r.json())
 .then(res => {
    alert(res.mesaj);
    if(res.status === 'ok') {
      notlariYukle();
      ['not1','not2','not3','not4'].forEach(id => document.getElementById(id).value = '');
    }
  });
}

function notlariYukle() {
  fetch(URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: 'notlariGetir', tel: aktifTel})
  })
 .then(r => r.json())
 .then(res => {
    let html = '';
    res.notlar.forEach(n => {
      html += `<div><b>${n.ders}</b> Y1:${n.y1||'-'} Y2:${n.y2||'-'} Y3:${n.y3||'-'} Y4:${n.y4||'-'} Ort:${n.ort||'-'}</div>`;
    });
    document.getElementById('notlar').innerHTML = html || 'Not yok';
  });
}

function duyurulariYukle() {
  fetch(URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: 'duyurulariGetir', tel: aktifTel, sinif: aktifSinif})
  })
 .then(r => r.json())
 .then(res => {
    let html = '';
    res.duyurular.forEach(d => {
      html += `<div><b>${d.baslik}</b><br>${d.mesaj}</div><hr>`;
    });
    document.getElementById('duyurular').innerHTML = html || 'Duyuru yok';
  });
}
</script>
