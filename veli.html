<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veli Not Giriş Sistemi</title>
<style>
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial;margin:0;padding:20px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh}
.kutu{max-width:480px;margin:30px auto;background:white;padding:25px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
h2{text-align:center;color:#333;margin-bottom:25px}
label{font-weight:600;color:#555;display:block;margin-top:12px}
input,select{width:100%;padding:12px;margin:6px 0 15px;border:2px solid #e0e0e0;border-radius:8px;font-size:15px;transition:0.3s}
input:focus,select:focus{border-color:#667eea;outline:none}
button{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:14px;border:none;border-radius:8px;width:100%;font-size:16px;font-weight:600;cursor:pointer;transition:0.3s;margin-top:10px}
button:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(102,126,234,0.4)}
button:disabled{background:#ccc;transform:none;cursor:not-allowed}
.ortalama{font-size:28px;font-weight:bold;color:#667eea;text-align:center;margin:20px 0;padding:15px;background:#f5f5ff;border-radius:10px}
.sonuc{margin-top:15px;padding:12px;border-radius:8px;text-align:center;font-weight:600}
.basarili{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.hata{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
#notPanel{display:none}
</style>
</head>
<body>
<div class="kutu">
<h2>📝 Veli Not Giriş</h2>

<div id="giris">
<label>Öğrenci No:</label>
<input type="text" id="ogrNo" placeholder="Öğrenci numarasını girin" autocomplete="off">
<button onclick="ogrenciGiris()">Giriş Yap</button>
</div>

<div id="notPanel">
<h3 id="ogrBilgi" style="color:#667eea;text-align:center"></h3>
<label>Ders:</label>
<select id="ders">
<option value="">Ders seçin</option>
<option>Matematik</option>
<option>Türkçe</option>
<option>Fen Bilimleri</option>
<option>Sosyal Bilgiler</option>
<option>İngilizce</option>
<option>Din Kültürü</option>
<option>Beden Eğitimi</option>
</select>

<label>1. Yazılı:</label>
<input type="number" id="n1" min="0" max="100" placeholder="0-100 arası" oninput="hesapla()">

<label>2. Yazılı:</label>
<input type="number" id="n2" min="0" max="100" placeholder="0-100 arası" oninput="hesapla()">

<label>3. Yazılı:</label>
<input type="number" id="n3" min="0" max="100" placeholder="0-100 arası" oninput="hesapla()">

<label>4. Yazılı:</label>
<input type="number" id="n4" min="0" max="100" placeholder="0-100 arası" oninput="hesapla()">

<div class="ortalama">Ortalama: <span id="ortalama">0.0</span></div>

<button id="gonderBtn" onclick="gonder()">Gönder</button>
<div id="sonuc"></div>
</div>
</div>

<script>
let ogrenci = {};
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyoPH09IZwBbQK1xjmVq1J9mekDzJ48nILUIJqQtL5LrMhPI8I5xgIlm5JKAYi1YA3E/exec';

function ogrenciGiris(){
const no = document.getElementById('ogrNo').value.trim();
if(!no){ alert('Öğrenci no girin'); return; }
ogrenci.no = no;
document.getElementById('giris').style.display = 'none';
document.getElementById('notPanel').style.display = 'block';
document.getElementById('ogrBilgi').textContent = 'Öğrenci No: ' + no;
}

function hesapla(){
const n1 = parseFloat(document.getElementById('n1').value) || 0;
const n2 = parseFloat(document.getElementById('n2').value) || 0;
const n3 = parseFloat(document.getElementById('n3').value) || 0;
const n4 = parseFloat(document.getElementById('n4').value) || 0;
const ort = ((n1+n2+n3+n4)/4).toFixed(1);
document.getElementById('ortalama').textContent = ort;
}

function gonder(){
const btn = document.getElementById('gonderBtn');
const ders = document.getElementById('ders').value;
const n1 = document.getElementById('n1').value;
const n2 = document.getElementById('n2').value;
const n3 = document.getElementById('n3').value;
const n4 = document.getElementById('n4').value;
const ort = document.getElementById('ortalama').textContent;

if(!ders){ alert('Ders seçin'); return; }
if(!n1 || !n2 || !n3 || !n4){ alert('4 notu da girin'); return; }
if(n1>100 || n2>100 || n3>100 || n4>100){ alert('Notlar 100\'ü geçemez'); return; }

const notlar = `Y1:${n1} Y2:${n2} Y3:${n3} Y4:${n4} Ort:${ort}`;
btn.disabled = true;
btn.textContent = 'Gönderiliyor...';
document.getElementById('sonuc').innerHTML = '';

fetch(SCRIPT_URL, {
  method: 'POST',
  mode: 'no-cors',
  body: new URLSearchParams({
    no: ogrenci.no,
    ders: ders,
    notlar: notlar
  })
})
.then(() => {
  document.getElementById('sonuc').innerHTML = '<div class="sonuc basarili">✅ Notlar başarıyla gönderildi!</div>';
  setTimeout(()=>{ location.reload(); }, 2500);
})
.catch(err => {
  document.getElementById('sonuc').innerHTML = '<div class="sonuc hata">❌ Bağlantı hatası. İnterneti kontrol edin.</div>';
  btn.disabled = false;
  btn.textContent = 'Gönder';
});
}
</script>
</body>
</html>
